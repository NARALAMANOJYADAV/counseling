<!DOCTYPE html>
<html lang="en">
<div style="display:none;">{% load static %}</div>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Operations | Admin Portal</title>

    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Styles from Dashboard -->
    <link rel="stylesheet" href="{% static 'stylesheets/advanced_dashboard.css' %}">

    <!-- React & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Boxicons CSS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body style="background: #0f172a; color: #f8fafc; font-family: 'Outfit', sans-serif;">
    <div id="root"></div>

    <script>
        window.CUR_USER = "{{ user.username|default:'Admin' }}";
        window.ALL_STUDENTS = JSON.parse('{{ all_students_json|escapejs|default:"[]" }}');
        window.IS_SUPERUSER = "{{ is_superuser }}" === "True";
        
        window.URLS = {
            'dashboard': "{% url 'admin_dashboard' %}",
            'counseling': "/admin/counseling/studentcounseling/",
            'users_admin': "{% url 'admin_users' %}",
            'bulk_ops': "{% url 'admin_bulk_manage' %}",
            'logout': "{% url 'logout' %}"
        };
        window.CSRF_TOKEN = "{{ csrf_token }}";
    </script>

    {% verbatim %}
    <script type="text/babel">
        const { useState } = React;

        const BulkManagePage = () => {
            const [counselorName, setCounselorName] = useState("");
            const [rangeStart, setRangeStart] = useState("");
            const [rangeEnd, setRangeEnd] = useState("");
            
            const [studentYear, setStudentYear] = useState("");
            const [branch, setBranch] = useState("");
            const [section, setSection] = useState("");
            
            // Single Student State
            const [singleRoll, setSingleRoll] = useState("");
            const [singleName, setSingleName] = useState("");
            const [singleEmail, setSingleEmail] = useState("");
            
            const [bulkStudentsText, setBulkStudentsText] = useState("");
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Handle Add Single Student
            const handleAddSingleStudent = async () => {
                if (!singleRoll.trim()) {
                    alert("Roll Number is required.");
                    return;
                }
                
                const students = [{
                    roll_number: singleRoll.trim(),
                    student_name: singleName.trim(),
                    email: singleEmail.trim(),
                    counselor_name: counselorName.trim()
                }];

                setIsSubmitting(true);
                try {
                    const res = await fetch("/bulk-add-students/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": window.CSRF_TOKEN
                        },
                        body: JSON.stringify({ students })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Successfully added ${students[0].roll_number}.`);
                        window.location.reload();
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (e) {
                    alert("Error adding student.");
                }
                setIsSubmitting(false);
            };

            // Handle Paste List / Add Students
            const handleBulkAdd = async () => {
                if (!bulkStudentsText.trim()) {
                    alert("Please enter student data.");
                    return;
                }
                
                const lines = bulkStudentsText.trim().split("\n");
                const students = [];
                for (let line of lines) {
                    const parts = line.split(",").map(p => p.trim());
                    if (parts.length >= 2 && parts[0]) {
                        students.push({
                            roll_number: parts[0],
                            student_name: parts[1],
                            email: parts[2] || "",
                            counselor_name: parts[3] || ""
                        });
                    }
                }
                
                if (students.length === 0) {
                    alert("No valid student data found. Format requires at least Roll Number and Name separated by comma.");
                    setIsSubmitting(false);
                    return;
                }

                setIsSubmitting(true);
                try {
                    const res = await fetch("/bulk-add-students/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": window.CSRF_TOKEN
                        },
                        body: JSON.stringify({ students })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Successfully added ${data.created} students.`);
                        setBulkStudentsText('');
                        window.location.reload();
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (e) {
                    alert("Error adding students.");
                }
                setIsSubmitting(false);
            };

            // Handle Generate Range
            const handleBulkAddRange = async () => {
                if (!rangeStart.trim() || !rangeEnd.trim()) {
                    alert("Please enter both start and end roll numbers.");
                    return;
                }
                setIsSubmitting(true);
                try {
                    const res = await fetch("/bulk-add-students/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": window.CSRF_TOKEN
                        },
                        body: JSON.stringify({ 
                            mode: 'range',
                            start: rangeStart.trim(),
                            end: rangeEnd.trim(),
                            counselor_name: counselorName.trim(),
                            student_year: studentYear.trim(),
                            branch: branch.trim(),
                            section: section.trim()
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Successfully created ${data.created} new students in range.`);
                        window.location.reload();
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (e) {
                    alert("Error creating students.");
                }
                setIsSubmitting(false);
            };

            // Select And Apply to Range directly
            const handleSelectAndApply = async () => {
                if (!rangeStart.trim() || !rangeEnd.trim()) {
                    alert("Please enter both start and end roll numbers to apply properties.");
                    return;
                }
                
                if (!counselorName.trim() && !studentYear.trim() && !branch.trim() && !section.trim()) {
                    alert("Please specify at least one property (counselor, year, branch, sec) to apply.");
                    return;
                }

                const start = rangeStart.trim().toUpperCase();
                const end = rangeEnd.trim().toUpperCase();
                
                // Collect existing student rolls falling in this range
                const targetRolls = window.ALL_STUDENTS.filter(s => {
                    const r = s.username.toUpperCase();
                    return r >= start && r <= end;
                }).map(s => s.username);
                
                if (targetRolls.length === 0) {
                    alert(`No existing students found between ${start} and ${end}. Generate them first using 'Add Students by Range'`);
                    return;
                }
                
                setIsSubmitting(true);
                try {
                    const res = await fetch("/bulk-assign-counselor/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRFToken": window.CSRF_TOKEN
                        },
                        body: JSON.stringify({
                            roll_numbers: targetRolls,
                            counselor_name: counselorName.trim(),
                            student_year: studentYear.trim(),
                            branch: branch.trim(),
                            section: section.trim(),
                            action: 'assign'
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`Successfully updated properties for ${data.updated} students in the selected range.`);
                        window.location.reload();
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (e) {
                    alert("Error applying properties.");
                }
                setIsSubmitting(false);
            };

            return (
                <div className="dashboard-layout">
                    <aside className="sidebar">
                        <div className="logo">
                            <i className='bx bx-data' style={{ color: '#818cf8', fontSize: '24px' }}></i>
                            <span>BULK MGMT</span>
                        </div>

                        <nav className="nav-links">
                            <div className="nav-item">
                                <a href={window.URLS['dashboard']} className="nav-link">
                                    <i className='bx bxs-dashboard' style={{ color: '#94a3b8' }}></i>
                                    <span>Home</span>
                                </a>
                            </div>
                            <div className="nav-item">
                                <a href={window.URLS['counseling']} className="nav-link">
                                    <i className='bx bx-list-ul' style={{ color: '#94a3b8' }}></i>
                                    <span>Approvals</span>
                                </a>
                            </div>
                            <div className="nav-item">
                                <a href={window.URLS['users_admin']} className="nav-link">
                                    <i className='bx bxs-group' style={{ color: '#94a3b8' }}></i>
                                    <span>Users Registry</span>
                                </a>
                            </div>
                            <div className="nav-item">
                                <a href="#" className="nav-link active">
                                    <i className='bx bx-layer-plus' style={{ color: 'white' }}></i>
                                    <span>Bulk Operations</span>
                                </a>
                            </div>

                            <div className="nav-item logout-item">
                                <a href={window.URLS['logout']} className="nav-link logout-link-sidebar">
                                    <i className='bx bx-log-out' style={{ color: '#ef4444' }}></i>
                                    <span>Exit Portal</span>
                                </a>
                            </div>
                        </nav>
                    </aside>

                    <main className="main-content">
                        <header className="header">
                            <div className="welcome-section">
                                <h1 style={{ color: '#fff' }}>Bulk Operations</h1>
                                <p>Manage, generate, and assign properties for multiple students at once.</p>
                            </div>

                            <div className="profile-chip" style={{ background: '#1e293b', border: '1px solid rgba(255,255,255,0.1)' }}>
                                <div className="avatar" style={{ background: '#6366f1' }}>{(window.CUR_USER || 'A')[0].toUpperCase()}</div>
                                <span>{window.CUR_USER || 'Admin'}</span>
                            </div>
                        </header>
                        
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(350px, 1fr))', gap: '20px', marginTop: '20px' }}>
                            {/* Card 1: Add by Range */}
                            <div style={{ background: '#1e293b', padding: '1.5rem', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.1)' }}>
                                <h2 style={{ margin: '0 0 1rem 0', color: '#fff', display: 'flex', alignItems: 'center', gap: '10px', fontSize: '1.25rem' }}>
                                    <i className='bx bx-layer-plus' style={{ color: '#059669' }}></i> Add by Range
                                </h2>
                                <p style={{ color: '#94a3b8', fontSize: '13px', marginBottom: '15px' }}>
                                    Generate and add NEW sequential student profiles. If they exist, they will be skipped.
                                </p>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                    <input type="text" placeholder="Start Roll (e.g. 20KB1A4201)" value={rangeStart} onChange={e => setRangeStart(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <input type="text" placeholder="End Roll (e.g. 20KB1A4260)" value={rangeEnd} onChange={e => setRangeEnd(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    
                                    <hr style={{ border: 'none', borderTop: '1px solid #334155', margin: '5px 0' }} />
                                    <p style={{ color: '#94a3b8', fontSize: '12px', margin: 0 }}>Properties to apply (Optional):</p>
                                    
                                    <input type="text" placeholder="Counselor Name" value={counselorName} onChange={e => setCounselorName(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '10px' }}>
                                        <input type="text" placeholder="Year" value={studentYear} onChange={e => setStudentYear(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                        <input type="text" placeholder="Branch" value={branch} onChange={e => setBranch(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                        <input type="text" placeholder="Sec" value={section} onChange={e => setSection(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    </div>
                                    
                                    <button onClick={handleBulkAddRange} disabled={isSubmitting} style={{ width: '100%', background: '#059669', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', marginTop: '10px' }}>
                                        {isSubmitting ? 'Working...' : 'Generate New Students'}
                                    </button>
                                </div>
                            </div>
                            
                            {/* Card 2: Select by Range (Update) */}
                            <div style={{ background: '#1e293b', padding: '1.5rem', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.1)' }}>
                                <h2 style={{ margin: '0 0 1rem 0', color: '#fff', display: 'flex', alignItems: 'center', gap: '10px', fontSize: '1.25rem' }}>
                                    <i className='bx bx-move-horizontal' style={{ color: '#3b82f6' }}></i> Select by Range
                                </h2>
                                <p style={{ color: '#94a3b8', fontSize: '13px', marginBottom: '15px' }}>
                                    Update properties for EXISTING students falling within the entered roll number range.
                                </p>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                    <input type="text" placeholder="Start Roll (e.g. 20KB1A4201)" value={rangeStart} onChange={e => setRangeStart(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <input type="text" placeholder="End Roll (e.g. 20KB1A4260)" value={rangeEnd} onChange={e => setRangeEnd(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    
                                    <hr style={{ border: 'none', borderTop: '1px solid #334155', margin: '5px 0' }} />
                                    <p style={{ color: '#94a3b8', fontSize: '12px', margin: 0 }}>Properties to apply (Optional):</p>
                                    
                                    <input type="text" placeholder="Counselor Name" value={counselorName} onChange={e => setCounselorName(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '10px' }}>
                                        <input type="text" placeholder="Year" value={studentYear} onChange={e => setStudentYear(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                        <input type="text" placeholder="Branch" value={branch} onChange={e => setBranch(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                        <input type="text" placeholder="Sec" value={section} onChange={e => setSection(e.target.value)} style={{ background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    </div>
                                    
                                    <button onClick={handleSelectAndApply} disabled={isSubmitting} style={{ width: '100%', background: '#3b82f6', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', marginTop: '10px' }}>
                                        {isSubmitting ? 'Working...' : 'Apply to Selected Range'}
                                    </button>
                                </div>
                            </div>

                            {/* Card 3: Paste List */}
                            <div style={{ background: '#1e293b', padding: '1.5rem', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.1)' }}>
                                <h2 style={{ margin: '0 0 1rem 0', color: '#fff', display: 'flex', alignItems: 'center', gap: '10px', fontSize: '1.25rem' }}>
                                    <i className='bx bx-list-plus' style={{ color: '#10b981' }}></i> Paste List (CSV style)
                                </h2>
                                <p style={{ color: '#94a3b8', fontSize: '13px', marginBottom: '15px' }}>
                                    Enter one student per line: <strong>Roll, Name, Email (opt), Counselor (opt)</strong>
                                </p>
                                
                                <textarea 
                                    value={bulkStudentsText}
                                    onChange={e => setBulkStudentsText(e.target.value)}
                                    placeholder={`20KB1A4240, John Doe, john@example.com, Dr. Smith\n20KB1A4241, Jane Doe, , Dr. Smith`}
                                    style={{ width: '100%', height: '220px', background: '#0f172a', color: '#fff', border: '1px solid #334155', borderRadius: '8px', padding: '15px', fontFamily: 'monospace', fontSize: '14px', resize: 'vertical' }}
                                ></textarea>
                                
                                <button onClick={handleBulkAdd} disabled={isSubmitting} style={{ width: '100%', background: '#10b981', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', marginTop: '10px' }}>
                                    {isSubmitting ? 'Adding...' : 'Add Pasted Students'}
                                </button>
                            </div>
                            
                            {/* Card 4: Add Single Student */}
                            <div style={{ background: '#1e293b', padding: '1.5rem', borderRadius: '12px', border: '1px solid rgba(255,255,255,0.1)' }}>
                                <h2 style={{ margin: '0 0 1rem 0', color: '#fff', display: 'flex', alignItems: 'center', gap: '10px', fontSize: '1.25rem' }}>
                                    <i className='bx bx-user-plus' style={{ color: '#f59e0b' }}></i> Add Single Student
                                </h2>
                                <p style={{ color: '#94a3b8', fontSize: '13px', marginBottom: '15px' }}>
                                    Quickly add a single student by entering their basic details below.
                                </p>
                                
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                    <input type="text" placeholder="Roll Number (Required)" value={singleRoll} onChange={e => setSingleRoll(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <input type="text" placeholder="Full Name" value={singleName} onChange={e => setSingleName(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <input type="email" placeholder="Email Address" value={singleEmail} onChange={e => setSingleEmail(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    <input type="text" placeholder="Counselor Name (Optional)" value={counselorName} onChange={e => setCounselorName(e.target.value)} style={{ width: '100%', background: '#0f172a', color: '#fff', border: '1px solid #334155', padding: '10px', borderRadius: '6px' }}/>
                                    
                                    <button onClick={handleAddSingleStudent} disabled={isSubmitting} style={{ width: '100%', background: '#f59e0b', color: '#fff', border: 'none', padding: '10px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold', marginTop: '10px' }}>
                                        {isSubmitting ? 'Working...' : 'Add Student'}
                                    </button>
                                </div>
                            </div>
                        </div>

                    </main>
                </div>
            );
        };

        window.addEventListener('load', () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<BulkManagePage />);
        });
    </script>
    {% endverbatim %}
</body>
</html>
