<!DOCTYPE html>
<html lang="en">
<div style="display:none;">{% load static %}</div>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory | Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'stylesheets/advanced_dashboard.css' %}">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        :root { --accent: #e46033; --accent2: #f97316; --bg: #25252b; --card: #2e2e36; --border: rgba(228,96,51,0.25); }
        body { background: var(--bg) !important; }
        .sidebar { background: var(--bg) !important; border-right: 1px solid var(--border) !important; }
        .logo span { color: var(--accent) !important; }
        .nav-link.active { background: rgba(228,96,51,0.15) !important; border-left: 3px solid var(--accent) !important; }
        .nav-link.active i, .nav-link.active span { color: var(--accent) !important; }
        .nav-link:hover { background: rgba(228,96,51,0.08) !important; }
        .main-content { background: var(--bg) !important; }
        .ou-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
        .ou-input { background: #1a1a20 !important; border: 1px solid var(--border) !important; color: #fff !important; border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; width: 100%; font-family: 'Outfit', sans-serif; }
        .ou-input:focus { border-color: var(--accent) !important; box-shadow: 0 0 0 3px rgba(228,96,51,0.15); }
        .ou-btn { border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px; padding: 9px 18px; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; font-family: 'Outfit', sans-serif; }
        .ou-btn:hover { opacity: 0.85; }
        .ou-btn-primary { background: var(--accent); color: #fff; }
        .ou-btn-secondary { background: #3b3b45; color: #94a3b8; }
        .ou-btn-danger { background: #ef4444; color: #fff; }
        .ou-btn-green { background: #059669; color: #fff; }
        .ou-btn-blue { background: #3b82f6; color: #fff; }
        .ou-th { padding: 13px 14px; text-align: left; color: #64748b; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; border-bottom: 2px solid rgba(228,96,51,0.2); background: #1a1a20; white-space: nowrap; }
        .ou-td { padding: 13px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .ou-tr:hover td { background: rgba(228,96,51,0.04); }
        .ou-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; width: 90%; max-width: 560px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .modal-title { color: #fff; font-size: 18px; font-weight: 700; margin: 0 0 20px 0; display: flex; align-items: center; gap: 10px; }
        .chip-count { background: rgba(228,96,51,0.15); color: var(--accent); border: 1px solid rgba(228,96,51,0.3); border-radius: 8px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
        .lbl { display: block; margin-bottom: 6px; font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
        select.ou-input option { background: #25252b; }
    </style>
</head>
<body>
<div id="root"></div>

<script>
    window.CUR_USER     = "{{ user.username|default:'Admin' }}";
    window.ALL_STUDENTS = JSON.parse('{{ all_students_json|escapejs|default:"[]" }}');
    window.IS_SUPERUSER = "{{ is_superuser }}" === "True";
    window.FILTER_DATA  = JSON.parse('{{ filter_data|escapejs|default:"{}" }}');
    window.URLS = {
        'dashboard':      "{% url 'admin_dashboard' %}",
        'approvals':      "{% url 'admin_approvals' %}",
        'student_search': "{% url 'student_search' %}",
        'users':          "{% url 'admin_users' %}",
        'bulk_ops':       "{% url 'admin_bulk_manage' %}",
        'export':         "{% url 'admin_export' %}",
        'django_admin':   "/admin/",
        'logout':         "{% url 'logout' %}"
    };
    window.CSRF_TOKEN = "{{ csrf_token }}";
</script>

{% verbatim %}
<script type="text/babel">
    const { useState } = React;

    const NAV = [
        { key:'dashboard',      label:'Home',            icon:'bxs-dashboard',    active:false },
        { key:'approvals',      label:'Approvals',       icon:'bx-list-check',    active:false },
        { key:'student_search', label:'Student Search',  icon:'bx-search-alt-2',  active:false },
        { key:'users',          label:'Users',           icon:'bx-group',         active:true  },
        { key:'bulk_ops',       label:'Bulk Operations', icon:'bx-layer-plus',    active:false },
        { key:'export',         label:'Export CSV',      icon:'bx-export',        active:false },
        { key:'django_admin',   label:'Admin Panel',     icon:'bxs-cog',          active:false, superOnly:true },
    ];

    const ROLE_COLORS = {
        'Super Admin': '#ef4444', 'Counselor': '#10b981', 'HOD': '#f59e0b',
        'Incharge': '#8b5cf6', 'Director': '#ec4899', 'Staff member': '#64748b',
    };
    const roleColor = r => ROLE_COLORS[r] || '#e46033';

    const BRANCHES = ['CSE','AIDS','ECE','EEE','MECH','CIVIL','IT','CHEM'];
    const SECTIONS = ['A','B','C','D','E','F','G','H','I','J'];

    /* ── Modal wrapper ── */
    const Modal = ({ title, icon, onClose, children }) => (
        <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
            <div className="modal-box">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
                    <h2 className="modal-title"><i className={`bx ${icon}`} style={{color:'#e46033'}}></i>{title}</h2>
                    <button onClick={onClose} style={{background:'transparent',border:'none',color:'#94a3b8',cursor:'pointer',fontSize:'22px',lineHeight:1}}>&times;</button>
                </div>
                {children}
            </div>
        </div>
    );

    const UsersPage = () => {
        const fd = window.FILTER_DATA;
        const cur = fd.current || {};

        /* selection */
        const [selected, setSelected] = useState([]);
        /* bulk assign fields */
        const [counselorName, setCounselorName] = useState('');
        const [branch, setBranch]               = useState('');
        const [section, setSection]             = useState('');
        /* modals */
        const [showRangeModal, setShowRangeModal] = useState(false);
        const [rangeStart, setRangeStart]         = useState('');
        const [rangeEnd, setRangeEnd]             = useState('');
        const [busy, setBusy]                     = useState(false);

        const toggleAll = e => setSelected(e.target.checked ? window.ALL_STUDENTS.map(s=>s.username) : []);
        const toggleOne = u => setSelected(p => p.includes(u) ? p.filter(x=>x!==u) : [...p, u]);

        const post = async (url, body) => {
            const r = await fetch(url, {
                method:'POST',
                headers:{'Content-Type':'application/json','X-CSRFToken':window.CSRF_TOKEN},
                body: JSON.stringify(body)
            });
            return r.json();
        };

        const bulkAssign = async (action='assign') => {
            if (!selected.length) return alert('Select at least one student.');
            if (action==='assign' && !counselorName.trim() && !branch && !section)
                return alert('Enter at least one property to update.');
            setBusy(true);
            const d = await post('/bulk-assign-counselor/', {
                roll_numbers: selected, counselor_name: action==='remove'?'':counselorName.trim(),
                branch, section, action
            });
            setBusy(false);
            if (d.success) { alert(`Updated ${d.updated} students.`); window.location.reload(); }
            else alert('Error: '+d.error);
        };

        const bulkDelete = async () => {
            if (!selected.length) return;
            if (!confirm(`Permanently delete ${selected.length} student(s)? This cannot be undone.`)) return;
            setBusy(true);
            const d = await post('/bulk-delete-students/', { roll_numbers: selected });
            setBusy(false);
            if (d.success) { alert(`Deleted ${d.deleted} records.`); window.location.reload(); }
            else alert('Error: '+d.error);
        };

        const selectRange = () => {
            if (!rangeStart.trim() || !rangeEnd.trim()) return alert('Enter both start and end roll numbers.');
            const s = rangeStart.trim().toUpperCase(), e = rangeEnd.trim().toUpperCase();
            const found = window.ALL_STUDENTS.filter(x => x.username.toUpperCase()>=s && x.username.toUpperCase()<=e).map(x=>x.username);
            if (!found.length) return alert('No students found in that range.');
            setSelected(p => Array.from(new Set([...p,...found])));
            setShowRangeModal(false);
            alert(`Added ${found.length} students to selection.`);
        };

        return (
            <div className="dashboard-layout">
                {/* Sidebar */}
                <aside className="sidebar">
                    <div className="logo">
                        <i className='bx bxs-user-detail' style={{color:'#e46033',fontSize:'24px'}}></i>
                        <span>ADMIN PANEL</span>
                    </div>
                    <nav className="nav-links">
                        {NAV.map(item => {
                            if (item.superOnly && !window.IS_SUPERUSER) return null;
                            return (
                                <div key={item.key} className="nav-item">
                                    <a href={window.URLS[item.key]||'#'} className={`nav-link${item.active?' active':''}`}>
                                        <i className={`bx ${item.icon}`}></i>
                                        <span>{item.label}</span>
                                    </a>
                                </div>
                            );
                        })}
                        <div className="nav-item logout-item">
                            <a href={window.URLS['logout']} className="nav-link logout-link-sidebar">
                                <i className='bx bx-log-out' style={{color:'#ef4444'}}></i>
                                <span>Exit Portal</span>
                            </a>
                        </div>
                    </nav>
                </aside>

                {/* Main */}
                <main className="main-content">
                    {/* Header */}
                    <header className="header">
                        <div className="welcome-section">
                            <h1 style={{color:'#fff'}}>User Registry</h1>
                            <p style={{color:'#94a3b8'}}>Complete directory of all registered accounts and roles.</p>
                        </div>
                        <div className="profile-chip" style={{background:'#2e2e36',border:'1px solid rgba(228,96,51,0.3)'}}>
                            <div className="avatar" style={{background:'#e46033'}}>{(window.CUR_USER||'A')[0].toUpperCase()}</div>
                            <span>{window.CUR_USER||'Admin'}</span>
                        </div>
                    </header>

                    {/* Stats row */}
                    <div style={{display:'flex',gap:'12px',marginBottom:'20px',flexWrap:'wrap'}}>
                        {[
                            {label:'Total Accounts', val:window.ALL_STUDENTS.length, color:'#e46033'},
                            {label:'Selected',       val:selected.length,            color:'#f59e0b'},
                        ].map(c=>(
                            <div key={c.label} className="ou-card" style={{padding:'14px 22px'}}>
                                <div style={{fontSize:'11px',color:'#64748b',fontWeight:'700',textTransform:'uppercase'}}>{c.label}</div>
                                <div style={{fontSize:'26px',fontWeight:'800',color:c.color}}>{c.val}</div>
                            </div>
                        ))}
                        <div style={{marginLeft:'auto',display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}}>
                            <a href={window.URLS['export']} className="ou-btn ou-btn-green">
                                <i className='bx bx-export'></i> Export CSV
                            </a>
                            <a href={window.URLS['bulk_ops']} className="ou-btn ou-btn-blue">
                                <i className='bx bx-layer-plus'></i> Bulk Operations
                            </a>
                        </div>
                    </div>

                    {/* Filter bar */}
                    <div className="ou-card" style={{padding:'18px 20px',marginBottom:'16px'}}>
                        <form action="." method="GET">
                            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(130px,1fr))',gap:'12px',alignItems:'flex-end'}}>
                                <div>
                                    <label className="lbl">Roll Number</label>
                                    <input className="ou-input" type="text" name="roll_number" defaultValue={cur.roll} placeholder="e.g. 22KB1A42" />
                                </div>
                                <div>
                                    <label className="lbl">Year / Sem</label>
                                    <select className="ou-input" name="year_sem" defaultValue={cur.ys}>
                                        <option value="">All</option>
                                        {(fd.sems||[]).map(s=><option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="lbl">Branch</label>
                                    <select className="ou-input" name="branch" defaultValue={cur.br}>
                                        <option value="">All</option>
                                        {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="lbl">Section</label>
                                    <select className="ou-input" name="section" defaultValue={cur.sec}>
                                        <option value="">All</option>
                                        {SECTIONS.map(s=><option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="lbl">Att %</label>
                                    <input className="ou-input" type="text" name="attendance_search" defaultValue={cur.att} placeholder="e.g. 75" />
                                </div>
                                <div style={{display:'flex',gap:'8px',alignItems:'flex-end'}}>
                                    <button type="submit" className="ou-btn ou-btn-primary" style={{flex:1}}>
                                        <i className='bx bx-search'></i> Apply
                                    </button>
                                    <a href="?" className="ou-btn ou-btn-secondary">
                                        <i className='bx bx-reset'></i>
                                    </a>
                                </div>
                            </div>
                        </form>
                    </div>

                    {/* Bulk action bar — shown when rows selected */}
                    {selected.length > 0 && (
                        <div className="ou-card" style={{padding:'14px 20px',marginBottom:'14px',borderColor:'rgba(228,96,51,0.4)'}}>
                            <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
                                <span className="chip-count">{selected.length} selected</span>
                                <input className="ou-input" type="text" placeholder="Counselor name" value={counselorName} onChange={e=>setCounselorName(e.target.value)} style={{width:'150px'}} />
                                <select className="ou-input" value={branch} onChange={e=>setBranch(e.target.value)} style={{width:'110px'}}>
                                    <option value="">Branch</option>
                                    {BRANCHES.map(b=><option key={b} value={b}>{b}</option>)}
                                </select>
                                <select className="ou-input" value={section} onChange={e=>setSection(e.target.value)} style={{width:'90px'}}>
                                    <option value="">Section</option>
                                    {SECTIONS.map(s=><option key={s} value={s}>{s}</option>)}
                                </select>
                                <button className="ou-btn ou-btn-primary" onClick={()=>bulkAssign('assign')} disabled={busy}>
                                    <i className='bx bx-save'></i> Update Properties
                                </button>
                                <button className="ou-btn" style={{background:'#854d0e',color:'#fef3c7'}} onClick={()=>bulkAssign('remove')} disabled={busy}>
                                    <i className='bx bx-user-minus'></i> Remove Counselor
                                </button>
                                <button className="ou-btn ou-btn-secondary" onClick={()=>setShowRangeModal(true)}>
                                    <i className='bx bx-selection'></i> Select by Range
                                </button>
                                {window.IS_SUPERUSER && (
                                    <button className="ou-btn ou-btn-danger" onClick={bulkDelete} disabled={busy}>
                                        <i className='bx bx-trash'></i> Delete Selected
                                    </button>
                                )}
                                <button className="ou-btn ou-btn-secondary" onClick={()=>setSelected([])}>
                                    <i className='bx bx-x'></i> Clear
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Table */}
                    <div className="ou-card" style={{overflow:'hidden'}}>
                        <div style={{padding:'16px 20px',borderBottom:'1px solid rgba(228,96,51,0.15)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                            <h3 style={{margin:0,color:'#fff',fontSize:'15px',fontWeight:'700',display:'flex',alignItems:'center',gap:'8px'}}>
                                <i className='bx bx-group' style={{color:'#e46033'}}></i>
                                Registered Accounts
                            </h3>
                            <span style={{fontSize:'12px',color:'#64748b'}}>{window.ALL_STUDENTS.length} total</span>
                        </div>
                        <div style={{overflowX:'auto'}}>
                            <table style={{width:'100%',borderCollapse:'collapse'}}>
                                <thead>
                                    <tr>
                                        <th className="ou-th" style={{width:'40px'}}>
                                            <input type="checkbox"
                                                checked={selected.length===window.ALL_STUDENTS.length && window.ALL_STUDENTS.length>0}
                                                onChange={toggleAll}
                                                style={{cursor:'pointer',accentColor:'#e46033'}} />
                                        </th>
                                        <th className="ou-th">Roll / Username</th>
                                        <th className="ou-th">Email</th>
                                        <th className="ou-th">Counselor</th>
                                        <th className="ou-th">Role</th>
                                        <th className="ou-th" style={{textAlign:'center'}}>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {window.ALL_STUDENTS.length > 0 ? window.ALL_STUDENTS.map(s => (
                                        <tr key={s.id} className="ou-tr" style={{background: selected.includes(s.username)?'rgba(228,96,51,0.05)':'transparent'}}>
                                            <td className="ou-td">
                                                <input type="checkbox"
                                                    checked={selected.includes(s.username)}
                                                    onChange={()=>toggleOne(s.username)}
                                                    style={{cursor:'pointer',accentColor:'#e46033'}} />
                                            </td>
                                            <td className="ou-td">
                                                <a href={`/student-search/?roll=${encodeURIComponent(s.username)}`}
                                                   style={{color:'#e46033',textDecoration:'none',fontWeight:'700',fontFamily:'monospace',fontSize:'13px',display:'inline-flex',alignItems:'center',gap:'5px'}}
                                                   onMouseEnter={e=>e.currentTarget.style.textDecoration='underline'}
                                                   onMouseLeave={e=>e.currentTarget.style.textDecoration='none'}>
                                                    {s.username}
                                                    <i className='bx bx-link-external' style={{fontSize:'12px',opacity:0.6}}></i>
                                                </a>
                                                {s.is_manual && (
                                                    <span style={{marginLeft:'6px',fontSize:'10px',background:'rgba(59,130,246,0.15)',color:'#60a5fa',padding:'2px 6px',borderRadius:'4px'}}>Manual</span>
                                                )}
                                            </td>
                                            <td className="ou-td" style={{color:'#94a3b8',fontSize:'13px'}}>{s.email||<span style={{color:'#475569'}}>—</span>}</td>
                                            <td className="ou-td" style={{color:'#cbd5e1',fontSize:'13px',fontWeight:'500'}}>{s.counselor_name||<span style={{color:'#475569',fontStyle:'italic'}}>Unassigned</span>}</td>
                                            <td className="ou-td">
                                                <span className="ou-badge" style={{background:roleColor(s.role_label)+'22',color:roleColor(s.role_label),border:`1px solid ${roleColor(s.role_label)}44`}}>
                                                    {s.role_label}
                                                </span>
                                            </td>
                                            <td className="ou-td" style={{textAlign:'center'}}>
                                                {s.username !== window.CUR_USER && (
                                                    <form method="POST" action={`/delete-student/${s.id}/`}
                                                        onSubmit={e=>{ if(!confirm(`Delete account ${s.username}?`)) e.preventDefault(); }}
                                                        style={{margin:0,display:'inline'}}>
                                                        <input type="hidden" name="csrfmiddlewaretoken" value={window.CSRF_TOKEN} />
                                                        <button type="submit" className="ou-btn ou-btn-danger" style={{padding:'5px 12px',fontSize:'11px'}}>
                                                            <i className='bx bx-trash'></i> Remove
                                                        </button>
                                                    </form>
                                                )}
                                            </td>
                                        </tr>
                                    )) : (
                                        <tr>
                                            <td colSpan="6" style={{padding:'50px',textAlign:'center',color:'#475569'}}>
                                                <i className='bx bx-user-x' style={{fontSize:'40px',display:'block',marginBottom:'10px',color:'#334155'}}></i>
                                                No accounts found matching your filters.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </main>

                {/* Range select modal */}
                {showRangeModal && (
                    <Modal title="Select by Roll Range" icon="bx-selection" onClose={()=>setShowRangeModal(false)}>
                        <div style={{display:'flex',flexDirection:'column',gap:'14px'}}>
                            <div>
                                <label className="lbl">Start Roll Number</label>
                                <input className="ou-input" type="text" placeholder="e.g. 22KB1A4201" value={rangeStart} onChange={e=>setRangeStart(e.target.value)} />
                            </div>
                            <div>
                                <label className="lbl">End Roll Number</label>
                                <input className="ou-input" type="text" placeholder="e.g. 22KB1A4260" value={rangeEnd} onChange={e=>setRangeEnd(e.target.value)} />
                            </div>
                            <div style={{display:'flex',gap:'10px',marginTop:'6px'}}>
                                <button className="ou-btn ou-btn-primary" onClick={selectRange} style={{flex:1}}>
                                    <i className='bx bx-check'></i> Select Range
                                </button>
                                <button className="ou-btn ou-btn-secondary" onClick={()=>setShowRangeModal(false)}>Cancel</button>
                            </div>
                        </div>
                    </Modal>
                )}
            </div>
        );
    };

    window.addEventListener('load', () => {
        ReactDOM.createRoot(document.getElementById('root')).render(<UsersPage />);
    });
</script>
{% endverbatim %}
</body>
</html>
