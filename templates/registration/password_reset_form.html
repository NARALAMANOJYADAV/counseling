{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password | NBKRIST</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'stylesheets/login_style.css' %}" id="main-styles">
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .form-box { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); padding: 40px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        .form-box h2 { text-align: center; color: #fff; font-size: 24px; margin-bottom: 25px; }
        .form-box p { color: #94a3b8; font-size: 14px; text-align: center; margin-bottom: 20px; line-height: 1.5; }
        .input-box { position: relative; margin-bottom: 25px; width: 100%; }
        .input-box input { width: 100%; height: 50px; background: transparent; border: 1px solid #334155; outline: none; border-radius: 8px; padding: 0 15px; color: #fff; font-size: 15px; grid-column: 1; transition: border-color 0.3s; box-sizing: border-box; }
        .input-box input:focus, .input-box input:valid { border-color: #6366f1; }
        .input-box label { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); font-size: 14px; color: #94a3b8; transition: .3s; pointer-events: none; }
        .input-box input:focus~label, .input-box input:valid~label { top: -8px; left: 10px; font-size: 12px; color: #6366f1; background: #0f172a; padding: 0 5px; }
        .btn { width: 100%; height: 50px; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.3s; margin-top: 15px; box-shadow: 0 0 10px rgba(99, 102, 241, 0.3); }
        .btn:hover { background: #4f46e5; box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; transition: color 0.3s; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Reset Password</h2>
        <p>Enter the email address associated with your account, and we'll email you a link to reset your password.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="input-box">
                <input type="email" name="email" id="email" required autocomplete="email">
                <label for="email">Registered Email Address</label>
            </div>
            <button type="submit" class="btn">Send reset link</button>
        </form>
        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
    </div>
</body>
</html>
