services:
  - type: web
    name: counseling
    runtime: python
    region: ohio
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "sh start.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: student_counseling
          property: externalConnectionString

databases:
  - name: student_counseling
    plan: free # Only available if user hasn't used their free DB slot yet
    region: ohio

