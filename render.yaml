services:
  - type: web
    name: counseling
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python create_admin.py && python create_approval_users.py"
    startCommand: "gunicorn student.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --log-level info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "True"
